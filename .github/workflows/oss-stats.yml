name: Open-source stats

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Fetch contributions from the GitHub search API
        run: node scripts/oss-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and redeploy if the numbers changed
        run: |
          git diff --quiet src/data/oss.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/oss.json
          git commit -m "chore: update open-source stats"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger the push-based
          # deploy, a workflow_dispatch does.
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
